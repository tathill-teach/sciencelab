<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6b3dc2">
<title>Science Lab | Teacher Login</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body class="teacher-artwork-page">
<main class="teacher-artwork-shell">
<img class="teacher-login-artwork" src="https://raw.githubusercontent.com/tathill-teach/sciencelab/main/Science%20Lab%20Teacher%20Login.png" alt="Science Lab Teacher Login illustrated classroom design">
<a class="teacher-back-hotspot" href="./index.html" aria-label="Back to Home"></a>
<form class="teacher-password-form" id="loginForm" aria-label="Teacher sign in">
<label class="visually-hidden" for="password">Enter teacher password</label>
<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter Password" aria-label="Enter Password" required>
<button class="teacher-toggle-password" id="togglePassword" type="button" aria-label="Show password" title="Show or hide password">◉</button>
<button class="teacher-signin-hotspot" type="submit" aria-label="Sign In"></button>
</form>
</main>
<div class="teacher-error-backdrop" id="errorModal" role="dialog" aria-modal="true" aria-labelledby="errorTitle">
<div class="teacher-error-card">
<div class="teacher-error-icon" aria-hidden="true">🔐</div>
<h2 id="errorTitle">Teacher sign-in isn't connected yet</h2>
<p>The login design is ready, but secure password verification still needs to be connected.</p>
<button id="closeError" type="button">Got it</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./script.js" defer></script>
</body>
</html>
